[project]
name = "interface-computer-use"
version = "0.1.0"
description = "Minimal computer-use automation take-home: LLM discovery, typed artifact, deterministic replay, safety, evidence, and human handoff."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "openai>=1.100.0",
    "playwright>=1.55.0",
    "python-multipart>=0.0.20",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "typer>=0.16.0",
    "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
]

[project.scripts]
computer-use = "computer_use_automation.cli:app"
demo-bank = "computer_use_automation.demo_app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/computer_use_automation"]

[tool.ruff]
line-length = 100

target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
